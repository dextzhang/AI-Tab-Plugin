<!DOCTYPE html>
<html>
<head>
  <title>多AI模型消息同步</title>
  <style>
    body {
      width: 450px;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }
    h3 {
      margin-top: 0;
      color: #333;
    }
    .tab-container {
      display: flex;
      margin-bottom: 15px;
      border-bottom: 1px solid #ddd;
    }
    .tab {
      padding: 8px 16px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab.active {
      border-bottom-color: #3b82f6;
      color: #3b82f6;
      font-weight: bold;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    textarea {
      width: 100%;
      height: 120px;
      margin-bottom: 15px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      resize: vertical;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-bottom: 10px;
    }
    button:hover {
      background: #2563eb;
    }
    button.secondary {
      background: #6b7280;
    }
    button.secondary:hover {
      background: #4b5563;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
    }
    .history-container {
      margin-top: 20px;
    }
    .history-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }
    .history-item {
      background: white;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-bottom: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .history-item:hover {
      background: #f0f9ff;
    }
    .history-time {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 5px;
    }
    .image-options {
      margin-bottom: 15px;
    }
    .image-option {
      margin-bottom: 8px;
    }
    .image-option label {
      display: block;
      font-size: 13px;
      margin-bottom: 3px;
    }
    .image-option input {
      width: 100%;
      padding: 6px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h3>多AI模型消息同步工具</h3>
  
  <div class="tab-container">
    <div class="tab active" data-tab="chat">文本消息</div>
    <div class="tab" data-tab="image">图片生成</div>
  </div>
  
  <div class="tab-content active" id="chat-tab">
    <textarea id="message" placeholder="输入要发送的消息..."></textarea>
    <button id="sendBtn">发送消息</button>
    
    <!-- 历史记录 -->
    <div class="history-container mt-4">
      <div class="history-title">最近发送的消息</div>
      <div id="historyList"></div>
      <button id="clearHistoryBtn" class="secondary">清空历史</button>
    </div>
  </div>
  
  <div class="tab-content" id="image-tab">
    <div class="image-options">
      <div class="image-option">
        <label>图片描述</label>
        <input type="text" id="imagePrompt" placeholder="描述你想要的图片...">
      </div>
      <div class="image-option">
        <label>图片尺寸</label>
        <input type="text" id="imageSize" placeholder="例如: 1024x1024" value="1024x1024">
      </div>
    </div>
    <button id="generateImageBtn">生成图片</button>
  </div>
  
  <div id="status" class="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
